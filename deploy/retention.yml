# Retention as code (F3). days: 0 = «храним вечно», отрицательное — ошибка файла.
# grace_days добавляется к each class: «удалили из горячего, но ещё можно достать».
# apply без --yes — dry-run и план; legal hold (aegis retention holds) имеет приоритет над
# любым классом: held не удаляется даже по явному --yes.
grace_days: 1
classes:
  # журнал решений: цепочка hash — доказательство, живёт дольше всего, что видит пользователь
  journal:
    days: 730
  # сырьё инструментов: внешние страницы, пересказанныемоделью — исходник нужден ровно до verify-окна
  tool_output:
    days: 90
  # промпты/ответы в полном теле: дороже всего по объёму, и именно их просит забыть пользователь
  conversation:
    days: 365
  # метрики: агрегаты дёшевы, но SLO-окна старше года никому не нужны построчно
  metrics:
    days: 400
