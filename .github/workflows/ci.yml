name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  static:
    name: Статика и юнит-тесты
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,durable]"
      - name: ruff (lint)
        run: ruff check src tests migrations evals
      - name: ruff (format check)
        run: ruff format --check src tests migrations evals
      - name: shell (синтаксис скриптов deploy/)
        run: bash -n deploy/backup.sh
      - name: mypy --strict
        run: mypy src
      - name: import-linter (границы доменов)
        run: lint-imports
      - name: pytest (unit)
        run: pytest -q -m "not integration"
        env:
          DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5432/aegis
          TELEGRAM_BOT_TOKEN: ci-token
          TELEGRAM_OWNER_ID: "1"
          GLM_API_KEY: ci-key
      - name: evals (офлайн-золотые наборы)
        # run_repro — закреплённые байты и хэши журнала: смена канонизации обязана валить CI,
        # иначе журнал тихо станет неверифицируемым
        run: |
          python evals/run_golden.py
          python evals/run_repro.py

  integration:
    name: Postgres/Redis интеграция
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5432/aegis
      AEGIS_TEST_DATABASE_URL: postgresql+asyncpg://aegis:aegis@localhost:5432/aegis
      REDIS_URL: redis://localhost:6379/0
      TELEGRAM_BOT_TOKEN: ci-token
      TELEGRAM_OWNER_ID: "1"
      GLM_API_KEY: ci-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: миграции (alembic upgrade head)
        run: alembic upgrade head
      - name: повторный запуск миграций (идемпотентность)
        run: alembic downgrade base && alembic upgrade head
      - name: pytest (integration)
        run: pytest -q -m integration
      - name: проверка схемы
        run: |
          psql "postgresql://aegis:aegis@localhost:5432/aegis" -v ON_ERROR_STOP=1 -c "
          select extname from pg_extension where extname in ('vector','pg_trgm');" -c "
          select count(*) from platform.events;"

  image:
    name: Сборка образа
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: aegis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: образ умеет отдавать список инструментов без секретов
        run: docker run --rm aegis:ci aegis tools
