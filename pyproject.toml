[project]
name = "aegis"
version = "0.1.0"
description = "Aegis — личный AI-менеджер (single user, Telegram-first, GLM-backed)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "aegis owner" }]

# Ядро шага 1. Всё, что нужно, чтобы бот отвечал, запоминал, искал и смотрел на картинки.
dependencies = [
  "aiogram>=3.13",
  "openai>=1.50",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "trafilatura>=1.12",
  "structlog>=24.1",
  "orjson>=3.10",
  "python-dateutil>=2.9",
  "pillow>=10.4",
  # конвертовое шифрование (F3): AESGCM без самодеятельной криптографии
  "cryptography>=42.0",
  # контракт событий (F4): проверка envelope по JSON Schema
  "jsonschema>=4.21",
  # политика/ретеншен/SLO как код (F5/F3/F7): декларативные файлы читаются из YAML
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Durable-слой (NATS + Temporal). В шаге 1 поднимается инфраструктура, но код её ещё не
# вызывает: первые подписчики outbox и AgentSession workflow появляются в шаге 2.
durable = ["nats-py>=2.7", "temporalio>=1.7"]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.108",
  "import-linter>=2.1",
  "fakeredis>=2.24",
  "pgserver>=0.1.3; python_version < '3.13'",  # переносной Postgres: интеграции без Docker
  "types-python-dateutil",
]

[project.scripts]
aegis = "aegis.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Промпты — файлы внутри пакета (docs-как-данные): без этой строки wheel соберётся без .md, и в
# контейнере `load("repro/judge")` упадёт с PromptNotFound. Editable-установка этого не замечает,
# поэтому ловить такое надо сборкой, а не прогоном.
[tool.setuptools.package-data]
"aegis.prompts" = ["**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = [
  "S101",    # assert в тестах — это и есть тест
  "ASYNC230",  # trafilatura/pillow/CPU-обработка: короткие блокирующие вставки, не таймер
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["src", "migrations"]

[[tool.mypy.overrides]]
module = ["trafilatura.*", "nats.*", "temporalio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: требует реального Postgres (AEGIS_TEST_DATABASE_URL) / Redis",
]
filterwarnings = ["error::DeprecationWarning:aegis.*"]

[tool.importlinter]
root_package = "aegis"

[[tool.importlinter.contracts]]
name = "domains are independent"
type = "independence"
modules = ["aegis.finance", "aegis.planning", "aegis.knowledge", "aegis.memory", "aegis.web"]

[[tool.importlinter.contracts]]
name = "platform does not import domains"
type = "forbidden"
source_modules = ["aegis.platform"]
forbidden_modules = ["aegis.agents", "aegis.finance", "aegis.planning", "aegis.interaction"]

[[tool.importlinter.contracts]]
name = "governance does not import agents or domains"
type = "forbidden"
source_modules = ["aegis.governance"]
forbidden_modules = ["aegis.agents", "aegis.finance", "aegis.planning", "aegis.interaction"]
